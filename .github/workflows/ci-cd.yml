name: CI/CD

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, test, build check)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        ports:
          - '5432:5432'
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: professorstem_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (non-blocking)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run tests
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/professorstem_test
          SECRET_KEY: dummy-secret-key-for-ci
          OPENAI_API_KEY: dummy-openai-key
          ANTHROPIC_API_KEY: dummy-anthropic-key
        run: pytest tests/ -v

      - name: Build / compile check
        run: python -m compileall .

  deploy-preview:
    name: Deploy Preview
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying preview for PR #${{ github.event.number }}..."
          echo "Deploying preview with configured Vercel credentials."
          echo "Preview deployment placeholder complete."

  deploy-production:
    name: Deploy Production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Deploying to production..."
          echo "Deploying with configured deployment credentials."
          echo "Production deployment placeholder complete."

      - name: Health check
        id: health
        run: |
          echo "Checking application health..."
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused \
            "${{ secrets.PROD_URL }}/api/health" || \
            curl -fsS --retry 5 --retry-delay 5 "${{ secrets.PROD_URL }}/"
          echo "Health check passed."

      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "Health check failed — rolling back to previous release..."
          echo "Triggering rollback on the deployment host..."
          echo "Rollback placeholder complete."
